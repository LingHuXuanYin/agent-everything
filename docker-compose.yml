# agent-everything · Docker Compose
#
#   docker compose up -d --build      # 启动
#   docker compose down               # 停止
#   docker compose logs -f            # 查看日志
#
# 前端 10001 → 容器 80；数据 API 10002 → 容器 3001。
# 镜像构建上下文为仓库根目录（需要共享 data/snapshot.json 与 workspaces 锁文件）。

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: agent-everything-server:latest
    container_name: agent-everything-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:10001
      # 抓取管道写入数据时使用；生产环境请务必修改
      INGEST_TOKEN: change-me
    ports:
      - "10002:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: agent-everything-web:latest
    container_name: agent-everything-web
    restart: unless-stopped
    ports:
      - "10001:80"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  default:
    name: agent-everything-net
