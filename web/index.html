<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agent everything · 全网 AI 算力与模型 API 价格情报</title>
    <meta
      name="description"
      content="持续抓取并归一化 GPU 裸金属、卡时租赁、文本推理、图像与视频生成 API 的价格，一处查询、对比与接入。"
    />
    <meta name="theme-color" content="#06080b" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ae-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f8f7' : '#06080b');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta property="og:title" content="agent everything · AI 算力与模型 API 价格情报" />
    <meta
      property="og:description"
      content="GPU 裸金属、卡时、文本推理、图像视频 API 的价格全景，归一化后可直接接入 Agent。"
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
